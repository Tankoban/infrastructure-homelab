name: Terraform Checks

on:
  push:

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format, Validate, and Plan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/aws/homelab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::758862546818:role/github-actions-terraform-plan
          aws-region: us-east-2
          role-session-name: terraform-plan-ci

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init

      - name: Run Gitleaks secret scan
        uses: step-security/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"

      - name: Run Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/aws
          framework: terraform
          quiet: true
          soft_fail: false

      - name: Validate Terraform
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_admin_cidr: "127.0.0.1/32"
        run: terraform plan -input=false -no-color
